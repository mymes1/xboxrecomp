name: Android pipeline

# Original Xbox disc image -> Android arm64-v8a, on the self-built test title
# (no game content; tools/android/testtitle) on every push, and on a disc
# image YOU provide when started by hand (workflow_dispatch: iso_url with
# iso_sha256 and/or iso_sha1, or the XBR_ISO_URL secret with XBR_ISO_SHA256
# and/or XBR_ISO_SHA1). SHA-1 is what disc databases such as Redump list.
# Instead of an image, the URL may point to a .zip of the disc's files (what
# extract-xiso leaves), with default.xbe at the zip's root.
#
# Each job publishes its result as a check run (tools/android/ci_report.py)
# and uploads the work directory's reports and native libraries.

on:
  push:
    branches: [ "arena/**", "main" ]
    paths:
      - "src/**"
      - "tools/**"
      - "templates/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "templates/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL of your own disc image (an authorized copy), of a .zip holding it, or of a .zip of the disc's files with default.xbe at its root (extract-xiso's output). Leave empty to use the XBR_ISO_URL secret, or to run the test title only."
        required: false
        default: ""
      iso_sha256:
        description: "SHA-256 of that image, or of the .zip (for a zip of the disc's files: of the zip). With iso_url, give this, iso_sha1, or both."
        required: false
        default: ""
      iso_sha1:
        description: "SHA-1 of that image or of the .zip (Redump lists the image's). When both digests are given, both must match."
        required: false
        default: ""
      upload_apk:
        description: "Also upload the APK and native libraries. They contain the game (code and files): on a public repository, anyone signed in to GitHub can download artifacts."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  checks: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  XBOXRECOMP_ANDROID_DEPS: ${{ github.workspace }}/build/android-deps
  TESTTITLE_SHA256: 180edc50db6858e3b7c6821ed19130bfcfcde0bfeb73fe034293059df169dee2
  PYTHONUNBUFFERED: "1"

jobs:
  android-arm64:
    name: test title -> Android arm64-v8a (NDK) + Linux x86-64 run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned sources and host SDL2
        uses: actions/cache@v4
        with:
          path: |
            build/android-deps/src
            build/android-deps/host-sdl2
          key: android-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/android/deps.lock.json') }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('tools/android/deps.lock.json', 'templates/xbr-game/app/**/*.gradle') }}

      - name: Bootstrap pinned dependencies (verified, Gradle included)
        run: bash tools/android/bootstrap.sh --no-sdk --dev

      - name: Check the runner's NDK against the pin
        run: |
          want=$(python3 -c "import json;print(json.load(open('tools/android/deps.lock.json'))['android']['ndk']['revision'])")
          echo "pinned NDK $want; ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          grep Pkg.Revision "$ANDROID_HOME/ndk/$want/source.properties"
          echo "XBOXRECOMP_NDK=$ANDROID_HOME/ndk/$want" >> "$GITHUB_ENV"

      - name: Host SDL2 (pinned source) for the desktop run
        run: |
          if [ ! -f build/android-deps/host-sdl2/lib/cmake/SDL2/SDL2Config.cmake ]; then
            cmake -S build/android-deps/src/SDL2 -B build/android-deps/host-sdl2-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/build/android-deps/host-sdl2 -DSDL_TEST=OFF
            ninja -C build/android-deps/host-sdl2-build install > /dev/null
          fi

      - name: Unit tests (Android tooling, locked-RMW lowering)
        run: python3 -m pytest -q -p no:cacheprovider tools/android tools/recomp/test_lifter_locked_rmw.py 2>&1 | tee unit-tests.txt

      - name: Build the test title (reproducible) and check its hash
        run: |
          python3 -m tools.android.testtitle.build
          echo "$TESTTITLE_SHA256  build/testtitle/xbrtest.iso" | sha256sum -c -

      - name: "Pipeline: intake -> analyze -> recompile -> project -> host -> native (NDK) -> apk -> verify"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          python3 -m tools.android.pipeline run --source build/testtitle/xbrtest.iso \
            --sha256 "$TESTTITLE_SHA256" --work build/games/xbrtest --to verify \
            --native-mode ndk --ndk "$XBOXRECOMP_NDK" --host-seconds 20

      # The other kind of input: the disc's files as extract-xiso (the pinned
      # source) leaves them, zipped with default.xbe at the zip's root. The
      # same game must come out of it as out of the image.
      - name: "Intake from a zip of extract-xiso's output gives the same game"
        run: |
          cmake -S build/android-deps/src/extract-xiso -B build/extract-xiso -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build/extract-xiso > /dev/null
          rm -rf build/zipcheck && mkdir -p build/zipcheck
          (cd build/zipcheck && ../extract-xiso/extract-xiso -x ../testtitle/xbrtest.iso)
          (cd build/zipcheck/xbrtest && python3 -m zipfile -c ../xbrtest-files.zip .)
          python3 -m zipfile -l build/zipcheck/xbrtest-files.zip
          sha1=$(sha1sum build/zipcheck/xbrtest-files.zip | cut -d' ' -f1)
          python3 -m tools.android.pipeline run --source build/zipcheck/xbrtest-files.zip \
            --sha1 "$sha1" --work build/games/xbrtest-zip --to project
          diff -r build/games/xbrtest/game build/games/xbrtest-zip/game
          diff -r build/games/xbrtest/project/native/gen build/games/xbrtest-zip/project/native/gen
          diff build/games/xbrtest/project/xbr_game.json build/games/xbrtest-zip/project/xbr_game.json
          echo "zip of the files: same game files, generated code and configuration as the image"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.android.ci_report --work build/games/xbrtest --name android-arm64 --post --note-file unit-tests.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbrtest-android-arm64
          path: |
            build/games/xbrtest/reports
            build/games/xbrtest/out
            build/games/xbrtest/project/xbr_game.json
            build/games/xbrtest/game_manifest.json
            build/games/xbrtest/pipeline_state.json
          if-no-files-found: warn

  emulator:
    name: test-title APK on an Android emulator (arm64 code under ARM translation)
    needs: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: xbrtest-android-arm64
          path: build/games/xbrtest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK (x86_64 API 30 image; its ARM translation runs arm64-v8a apps)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 -m tools.android.device_run --work build/games/xbrtest --seconds 90 --touch --lifecycle --env RECOMP_AC97_READY=1 || echo "device run reported a failure"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.android.ci_report --work build/games/xbrtest --name emulator --post

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbrtest-emulator
          path: build/games/xbrtest/reports
          if-no-files-found: warn

  linux-arm64:
    name: test title on Linux arm64 (generated code + runtime on AArch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned sources and host SDL2
        uses: actions/cache@v4
        with:
          path: |
            build/android-deps/src
            build/android-deps/host-sdl2
          key: android-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/android/deps.lock.json') }}

      - name: Bootstrap pinned dependencies (verified)
        run: bash tools/android/bootstrap.sh --no-sdk --no-gradle --dev

      - name: Host SDL2 (pinned source)
        run: |
          if [ ! -f build/android-deps/host-sdl2/lib/cmake/SDL2/SDL2Config.cmake ]; then
            cmake -S build/android-deps/src/SDL2 -B build/android-deps/host-sdl2-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/build/android-deps/host-sdl2 -DSDL_TEST=OFF
            ninja -C build/android-deps/host-sdl2-build install > /dev/null
          fi

      - name: Build the test title (reproducible) and check its hash
        run: |
          python3 -m tools.android.testtitle.build
          echo "$TESTTITLE_SHA256  build/testtitle/xbrtest.iso" | sha256sum -c -

      - name: "Pipeline: intake -> ... -> host (AArch64 build and run)"
        run: |
          python3 -m tools.android.pipeline run --source build/testtitle/xbrtest.iso \
            --sha256 "$TESTTITLE_SHA256" --work build/games/xbrtest --to host --host-seconds 20

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.android.ci_report --work build/games/xbrtest --name linux-arm64 --post \
            --note "runner $(uname -m), page size $(getconf PAGESIZE)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbrtest-linux-arm64
          path: |
            build/games/xbrtest/reports
            build/games/xbrtest/pipeline_state.json
          if-no-files-found: warn

  vulkan-backend:
    # [android-port] The NV2A -> Vulkan back end (src/vk) draws the scenes of
    # tests/nv2a_vk_backend; the executor's CPU rasteriser draws them too, and
    # the framebuffers must agree. SwiftShader (pinned, verified) is the
    # Vulkan device: hosted runners have no GPU. Passing here is not evidence
    # about a phone GPU -- that needs the device run (docs/android/README.md).
    name: Vulkan back end vs the CPU rasteriser (SwiftShader)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: build/android-deps/src
          key: vk-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/android/deps.lock.json') }}

      - name: Pinned dependencies (Vulkan-Headers, glslang, SwiftShader; verified)
        run: bash tools/android/bootstrap.sh --no-sdk --no-gradle --vk-test

      - name: The committed SPIR-V matches its shaders
        run: python3 -m tools.android.vk_shaders --check

      - name: Executor tests (the back-end interface the Vulkan back end uses)
        run: |
          for t in nv2a_combiner nv2a_ffp_backend nv2a_pb_constants nv2a_pb_walk \
                   nv2a_raster_batch nv2a_tex_filter nv2a_vsh; do
            cmake -S tests/$t -B build/tests/$t -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo > /dev/null
            cmake --build build/tests/$t > /dev/null
            (cd build/tests/$t && ctest --output-on-failure)
          done

      - name: Vulkan back end against the CPU rasteriser
        id: vktest
        run: |
          source build/android-deps/android-env.sh
          cmake -S tests/nv2a_vk_backend -B build/tests/nv2a_vk_backend -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/tests/nv2a_vk_backend
          mkdir -p build/vk-test-out
          # Run directly, not through ctest: here exit 77 (no Vulkan device)
          # is a failure, not a skip.
          set -o pipefail
          VK_ICD_FILENAMES="$XBOXRECOMP_SWIFTSHADER_ICD" \
          LD_LIBRARY_PATH="$XBOXRECOMP_SWIFTSHADER_DIR" \
          RECOMP_VK_STATS=1000000 RECOMP_VK_TEST_OUT=build/vk-test-out \
            ./build/tests/nv2a_vk_backend/nv2a-vk-backend-test 2>&1 \
            | grep -v '^ *\[GPU\]' | tee build/vk-test-out/result.txt
          # The window presenter on a headless surface (swapchain, letterbox,
          # suspend/resume, the renderer on the presenter's device).
          VK_ICD_FILENAMES="$XBOXRECOMP_SWIFTSHADER_ICD" \
          LD_LIBRARY_PATH="$XBOXRECOMP_SWIFTSHADER_DIR" \
            ./build/tests/nv2a_vk_backend/nv2a-vk-present-test 2>&1 \
            | grep -v '^ *\[GPU\]' | tee -a build/vk-test-out/result.txt

      # The step summary is only visible in the web UI; the check run can be
      # read through the checks API, which is how results are verified.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.android.ci_report --name vulkan-backend --post \
            --text-file build/vk-test-out/result.txt --outcome "${{ steps.vktest.outcome }}" \
            --note "Vulkan back end vs the CPU rasteriser, and the window presenter on a headless surface, on SwiftShader (a CPU Vulkan device): not evidence about a phone GPU."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-backend-test
          path: build/vk-test-out
          if-no-files-found: warn

  user-title:
    name: your disc image -> Android arm64-v8a (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The inputs and the secrets each describe one image, so they are used
    # as sets: with iso_url given, the digests come from the inputs only,
    # never from secrets that may belong to a different image.
    env:
      IN_URL: ${{ inputs.iso_url }}
      IN_SHA256: ${{ inputs.iso_sha256 }}
      IN_SHA1: ${{ inputs.iso_sha1 }}
      SECRET_URL: ${{ secrets.XBR_ISO_URL }}
      SECRET_SHA256: ${{ secrets.XBR_ISO_SHA256 }}
      SECRET_SHA1: ${{ secrets.XBR_ISO_SHA1 }}
    steps:
      - name: Image source
        id: src
        run: |
          if [ -n "$IN_URL" ]; then
            url=$IN_URL sha256=$IN_SHA256 sha1=$IN_SHA1 from="workflow inputs"
          else
            url=$SECRET_URL sha256=$SECRET_SHA256 sha1=$SECRET_SHA1 from="repository secrets"
          fi
          if [ -z "$url" ]; then
            echo "No disc image given (iso_url input or XBR_ISO_URL secret); nothing to do."
            echo "have=0" >> "$GITHUB_OUTPUT"
          elif [ -z "$sha256" ] && [ -z "$sha1" ]; then
            echo "::error::an image URL needs its SHA-256 or SHA-1 (iso_sha256 / iso_sha1 inputs, or the XBR_ISO_SHA256 / XBR_ISO_SHA1 secrets)"
            exit 1
          else
            echo "Image from the $from; expected digests: ${sha256:+SHA-256 }${sha1:+SHA-1}"
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.src.outputs.have == '1'

      - uses: actions/setup-python@v5
        if: steps.src.outputs.have == '1'
        with:
          python-version: "3.12"

      # A full-disc dump is about 7.3 GiB, and the game files then exist
      # three times (extracted, Gradle's merged assets, the stored APK): the
      # work directory goes on the runner's larger disk when there is one.
      - name: Room for a full-size disc image
        if: steps.src.outputs.have == '1'
        run: |
          df -h / /mnt 2>/dev/null || true
          mkdir -p build/games
          root_free=$(df --output=avail -B1 . | tail -1)
          mnt_free=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/xbr-user
            sudo chown "$(id -u):$(id -g)" /mnt/xbr-user
            ln -sfn /mnt/xbr-user build/games/user
            echo "work directory on /mnt ($((mnt_free / 1024**3)) GiB free there)"
          else
            echo "work directory on the workspace disk ($((root_free / 1024**3)) GiB free)"
          fi

      - name: Bootstrap pinned dependencies (verified, Gradle included)
        if: steps.src.outputs.have == '1'
        run: bash tools/android/bootstrap.sh --no-sdk --dev

      - name: Host SDL2 (pinned source)
        if: steps.src.outputs.have == '1'
        run: |
          cmake -S build/android-deps/src/SDL2 -B build/android-deps/host-sdl2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/build/android-deps/host-sdl2 -DSDL_TEST=OFF
          ninja -C build/android-deps/host-sdl2-build install > /dev/null

      - name: "Pipeline on your image"
        if: steps.src.outputs.have == '1'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          if [ -n "$IN_URL" ]; then
            url=$IN_URL sha256=$IN_SHA256 sha1=$IN_SHA1
          else
            url=$SECRET_URL sha256=$SECRET_SHA256 sha1=$SECRET_SHA1
          fi
          digests=()
          if [ -n "$sha256" ]; then digests+=(--sha256 "$sha256"); fi
          if [ -n "$sha1" ]; then digests+=(--sha1 "$sha1"); fi
          want=$(python3 -c "import json;print(json.load(open('tools/android/deps.lock.json'))['android']['ndk']['revision'])")
          python3 -m tools.android.pipeline run --source "$url" "${digests[@]}" \
            --work build/games/user --to verify --native-mode ndk --ndk "$ANDROID_HOME/ndk/$want" \
            --host-seconds 60 --drop-image
          df -h . || true

      - name: Report
        if: always() && steps.src.outputs.have == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.android.ci_report --work build/games/user --name user-title --post

      # Reports only by default: the image, the extracted files, the native
      # libraries (recompiled game code) and the APK (all of it) stay on the
      # runner unless upload_apk is set.
      - uses: actions/upload-artifact@v4
        if: always() && steps.src.outputs.have == '1'
        with:
          name: user-title-reports
          path: |
            build/games/user/reports
            build/games/user/project/xbr_game.json
            build/games/user/pipeline_state.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success() && steps.src.outputs.have == '1' && inputs.upload_apk
        with:
          name: user-title-apk
          path: build/games/user/out
          retention-days: 7
          if-no-files-found: error
