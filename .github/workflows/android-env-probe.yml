name: Android toolchain probe

# Temporary: reports which Android/NDK/JDK versions the hosted runner
# carries, so the real APK workflow can pin against what exists.
on:
  push:
    branches: [ "arena/**" ]
    paths: [ ".github/workflows/android-env-probe.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Report toolchains
        run: |
          {
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "--- sdk"; ls "$ANDROID_HOME" || true
          echo "--- ndk"; ls "$ANDROID_HOME/ndk" || true
          echo "--- build-tools"; ls "$ANDROID_HOME/build-tools" || true
          echo "--- platforms"; ls "$ANDROID_HOME/platforms" || true
          echo "--- cmake"; ls "$ANDROID_HOME/cmake" || true
          echo "--- cmdline-tools"; ls "$ANDROID_HOME/cmdline-tools" || true
          echo "--- system-images"; ls -R "$ANDROID_HOME/system-images" 2>/dev/null | head -20 || true
          echo "--- emulator"; ls "$ANDROID_HOME/emulator" 2>/dev/null | head -5 || true
          echo "--- java"; java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME JAVA_HOME_17_X64=$JAVA_HOME_17_X64 JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          cmake --version | head -1
          ninja --version || true
          clang --version | head -1
          ls /usr/bin | grep -E '^(clang|lld|ld\.lld|lld-link|llvm-)' | tr '\n' ' '; echo
          gradle --version 2>/dev/null | head -5 || true
          python3 --version
          nproc; free -g; df -h / | tail -1
          ls -la /dev/kvm || true
          ls "$ANDROID_HOME/ndk/"*/shader-tools/linux-x86_64 2>/dev/null | head || true
          ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android" | head -50 || true
          cat "$ANDROID_NDK_LATEST_HOME/source.properties" || true
          } 2>&1 | tee probe.txt

      - name: Publish probe output as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os
          text = open("probe.txt", encoding="utf-8", errors="replace").read()[-60000:]
          body = {"name": "probe-report", "head_sha": os.environ["GITHUB_SHA"],
                  "status": "completed", "conclusion": "neutral",
                  "output": {"title": "Android toolchain probe",
                             "summary": "Hosted runner toolchain inventory",
                             "text": "```\n" + text + "\n```"}}
          json.dump(body, open("check.json", "w"))
          EOF
          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check.json --jq .html_url
