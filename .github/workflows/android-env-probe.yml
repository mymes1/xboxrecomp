name: Android toolchain probe

# Temporary: reports which Android/NDK/JDK versions the hosted runner
# carries, so the real APK workflow can pin against what exists.
on:
  push:
    branches: [ "arena/**" ]
    paths: [ ".github/workflows/android-env-probe.yml" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Report toolchains
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/cmake" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          java -version 2>&1
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64 JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
          cmake --version | head -1
          ninja --version || true
          clang --version | head -1
          ls /usr/bin | grep -E '^(clang|lld|ld\.lld|lld-link|llvm-)' | head -40
          gradle --version 2>/dev/null | head -5 || true
          python3 --version
          nproc; free -g; df -h / | tail -1
          ls -la /dev/kvm || true
