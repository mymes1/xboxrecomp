# Pinned and verified (tools/android/deps.lock.json). The pipeline runs the
# fetched Gradle directly; these properties are for opening the project in
# Android Studio, which checks the same checksum.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=@@GRADLE_URL@@
distributionSha256Sum=@@GRADLE_SHA256@@
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
