// Generated by tools/android/project.py (template: templates/xbr-game/app).
//
// The native libraries are not built here: the pipeline's `native` stage
// builds and checks them with the pinned NDK, and they arrive prebuilt in
// src/main/jniLibs/arm64-v8a. Game files arrive in src/main/assets/game.
// Settings come from ../xbr_game.json (the project stage's configuration).
plugins {
    id 'com.android.application'
}

def cfg = new groovy.json.JsonSlurper().parse(rootProject.file('xbr_game.json'))

// Release signing: a keystore named by the environment (CI secrets), else the
// key the pipeline generated for this project (see apk.py).
def xbrStore = System.getenv('XBR_KEYSTORE') ?: rootProject.file('signing/xbr-release.jks').path
def xbrPwFile = rootProject.file('signing/password.txt')
def xbrStorePass = System.getenv('XBR_KEYSTORE_PASSWORD') ?: (xbrPwFile.exists() ? xbrPwFile.text.trim() : '')
def xbrKeyAlias = System.getenv('XBR_KEY_ALIAS') ?: 'xbr'
def xbrKeyPass = System.getenv('XBR_KEY_PASSWORD') ?: xbrStorePass

android {
    namespace 'org.xboxrecomp.app'
    compileSdk @@COMPILE_SDK@@
    buildToolsVersion '@@BUILD_TOOLS@@'
    // Only used to strip the prebuilt libraries (llvm-strip keeps .dynsym,
    // which the crash handler's dladdr and SDL's dlsym need).
    ndkVersion '@@NDK_VERSION@@'

    defaultConfig {
        applicationId cfg.package
        minSdk cfg.android.min_sdk
        targetSdk cfg.android.target_sdk
        versionCode cfg.version_code
        versionName cfg.version_name
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile = file(xbrStore)
            storePassword = xbrStorePass
            keyAlias = xbrKeyAlias
            keyPassword = xbrKeyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // Stored uncompressed and page-aligned in the APK, loaded in place
            // (no copy to /data/app/.../lib at install).
            useLegacyPackaging false
        }
    }

    androidResources {
        // Game files are read once, at install, and are mostly compressed
        // data already: store them as they are.
        noCompress ''
        // aapt's default pattern also drops hidden files and directories
        // starting with '_'; a disc may have either, so only VCS litter goes.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
